name: Build and Publish Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Verify source
        run: ./gradlew lintDebug testDebugUnitTest

      - name: Restore signing keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_B64" || { echo "Missing GitHub secret RELEASE_KEYSTORE_B64" >&2; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "Missing GitHub secret RELEASE_STORE_PASSWORD" >&2; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "Missing GitHub secret RELEASE_KEY_PASSWORD" >&2; exit 1; }
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > release.keystore

      - name: Determine release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_VERSION="$(gh release list --limit 100 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' | sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' | head -n1)"
          if [ -z "$LATEST_VERSION" ]; then
            VERSION="1.0"
          else
            MAJOR="${LATEST_VERSION%%.*}"
            MINOR="${LATEST_VERSION#*.}"
            VERSION="${MAJOR}.$((MINOR + 1))"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          ./gradlew assembleRelease -PreleaseVersion="$VERSION"
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/kerberosauthenticator-$VERSION.apk"

      - name: Publish restartable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET="release-artifacts/kerberosauthenticator-$VERSION.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            TARGET_SHA="$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)"
            test "$IS_DRAFT" = "true" || {
              echo "Release $TAG already exists and is not a draft" >&2
              exit 1
            }
            test "$TARGET_SHA" = "$GITHUB_SHA" || {
              echo "Draft release $TAG belongs to $TARGET_SHA, not $GITHUB_SHA" >&2
              exit 1
            }
            gh release upload "$TAG" "$ASSET" --clobber
          else
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists without a reusable draft release" >&2
              exit 1
            fi
            gh release create "$TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Kerberos Authenticator $VERSION" \
              --notes "Automated release for commit ${GITHUB_SHA}" \
              "$ASSET"
          fi
          gh release edit "$TAG" --draft=false --latest
