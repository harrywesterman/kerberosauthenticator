name: Build and Publish Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Restore signing keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ]; then
            echo "Missing GitHub secret RELEASE_KEYSTORE_B64" >&2
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > release.keystore

      - name: Determine release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_VERSION="$(gh release list --limit 100 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' | sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' | head -n1)"
          if [ -z "$LATEST_VERSION" ]; then
            VERSION="1.0"
          else
            MAJOR="${LATEST_VERSION%%.*}"
            MINOR="${LATEST_VERSION#*.}"
            VERSION="${MAJOR}.$((MINOR + 1))"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          ./gradlew assembleRelease -PreleaseVersion="$VERSION"
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/kerberosauthenticator-$VERSION.apk"

      - name: Create git tag
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "Kerberos Authenticator $VERSION" \
            --notes "Automated release for commit ${GITHUB_SHA}" \
            "release-artifacts/kerberosauthenticator-$VERSION.apk"
